name: Déployer sur GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Vérifier la configuration publique et compiler
        run: |
          node --input-type=module <<'JS'
          const { VITE_SUPABASE_URL: url, VITE_SUPABASE_ANON_KEY: key } = process.env;
          let valid = /^sb_publishable_[A-Za-z0-9_-]+$/.test(key ?? '');
          if (!valid && /^[\w-]+\.[\w-]+\.[\w-]+$/.test(key ?? '')) {
            try {
              const payload = JSON.parse(Buffer.from(key.split('.')[1], 'base64url'));
              valid = payload.role === 'anon';
            } catch {}
          }
          if (!valid || !/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(url ?? '')) {
            console.error('Configurez une URL de projet Supabase et une clé publishable ou anon.');
            process.exit(1);
          }
          JS
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
